
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PET Finder Zynex</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b10;color:white;font-family:Arial,sans-serif;padding:18px}
header{text-align:center;color:#ff55b5;font-size:27px;font-weight:bold;margin:18px 0}
.subtitle{text-align:center;color:#aaa;margin-bottom:22px}
.panel{background:#171720;border:1px solid #3b2639;border-radius:16px;padding:16px;margin:12px 0}
label{display:block;color:#ff83ca;margin-bottom:8px}
select,button{width:100%;padding:13px;border-radius:9px;border:0;font-size:15px;margin:5px 0}
select{background:#292936;color:white}
button{background:#e83e9d;color:white;font-weight:bold}
#status{color:#ff9ad5;overflow-wrap:anywhere}
.egg{padding:12px;margin:10px 0;background:#242431;border-radius:10px;border-left:4px solid #ff55b5}
.name{font-weight:bold;font-size:17px}
.meta{color:#bbb;font-size:13px;margin-top:5px;overflow-wrap:anywhere}
footer{text-align:center;color:#777;font-size:12px;margin:22px 0}
</style>
</head>
<body>
<header>💗 PET FINDER ZYNEX</header>
<div class="subtitle">Buscador de reportes de huevos</div>

<div class="panel">
<label for="rarity">FILTRAR POR RAREZA</label>
<select id="rarity">
<option>ALL</option>
<option>SECRET</option>
<option>DIVINE</option>
<option>ETERNAL</option>
</select>
<button id="refresh">🔎 ACTUALIZAR REPORTES</button>
<p id="status">Preparado para conectar con Zynex.</p>
</div>

<div class="panel">
<strong>🥚 REPORTES ENCONTRADOS</strong>
<div id="results">Pulsa actualizar reportes.</div>
</div>

<footer>Los reportes de prueba no son huevos reales.</footer>

<script>
const API = "https://zynex-kf4o.onrender.com/reports";
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const rarityEl = document.getElementById("rarity");

async function refreshReports() {
  statusEl.textContent = "Conectando con Render...";
  resultsEl.textContent = "";

  try {
    const response = await fetch(API);

    if (!response.ok) {
      throw new Error("Error HTTP " + response.status);
    }

    const result = await response.json();

    // Acepta una lista o un objeto con la propiedad reports.
    if (Array.isArray(result)) {
      var reports = result;
    } else if (result && Array.isArray(result.reports)) {
      var reports = result.reports;
    } else {
      throw new Error("Formato de respuesta inesperado");
    }

    const selected = rarityEl.value;
    const filtered = selected === "ALL"
      ? reports
      : reports.filter(item =>
          String(item.rarity || "").toUpperCase() === selected
        );

    statusEl.textContent =
      "Conexión correcta · Reportes: " + filtered.length;

    if (filtered.length === 0) {
      resultsEl.textContent = "No hay reportes guardados para este filtro.";
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement("div");
      card.className = "egg";

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = "🥚 " + (item.name || "Huevo sin nombre");

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent =
        "Rareza: " + (item.rarity || "UNKNOWN") +
        " · Peso: " + (item.weight ?? "N/D") +
        " · Ingreso: " + (item.income ?? "N/D") +
        " · Servidor: " + (item.server_id || "N/D");

      card.append(name, meta);
      resultsEl.appendChild(card);
    });

  } catch (error) {
    statusEl.textContent = "Error: " + error.message;
    resultsEl.textContent =
      "No se pudieron cargar los reportes. Revisa la conexión con Render.";
  }
}

document.getElementById("refresh")
  .addEventListener("click", refreshReports);

rarityEl.addEventListener("change", refreshReports);
</script>
</body>
</html>
